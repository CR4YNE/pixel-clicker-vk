<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Куча Пряников: Кликер</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }   /* a sideways slider drag must not trigger the browser's back swipe */
    /* the game stays inside the safe area: the notch and the system bars at the top and the bottom are not covered */
    body { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <!-- the launch check covers the whole screen (shown by the game while the server checks the launch) -->
  <div id="launch-gate" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,8,24,0.9);color:#ffe9a8;font:14px sans-serif;letter-spacing:1px;z-index:10;"><span id="launch-text"></span></div>
  <script>
    // the VK bridge is loaded only when the game runs inside VK (VK adds vk_* parameters to the address);
    // elsewhere (for example, a plain browser or Yandex) the script is not loaded at all
    if (/[?&]vk_/.test(location.search)) {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/@vkontakte/vk-bridge@2.15.11/dist/browser.min.js';
      s.onload = function () {
        // tells VK that the game has started; must be sent within 30 seconds of the launch
        try { if (window.vkBridge) vkBridge.send('VKWebAppInit', {}); } catch (err) { /* ignore */ }
      };
      document.head.appendChild(s);
    }
  </script>
  <script src="src/font-data.js?v=6"></script>
  <script src="src/docs-text.js?v=4"></script>
  <script src="src/game.js?v=191"></script>
</body>
</html>
